; InfinityEngine-Enhancer sample configuration
; Place in the game root, next to the game executable, and adjust only when needed.

[Core]
VerboseLogs = false
; Aggregate RenderTexture enhancement timings every five seconds.
PerformanceLogs = false

[Rendering]
EnableAnisotropicFiltering = false
MaxAnisotropy = 8.0
LODBias = -0.25
; Draw creatures gliding between the engine's logic ticks instead of stepping
; at the logic rate. Only useful with EEex "Uncap FPS"; BGEE 2.7.3 only.
SmoothSpriteMovement = false
; Draw creature animations with the in-between frames found in iee-interp/
; (expanded BAMs, one per original resref). Animations without an expanded
; file are unaffected. Only useful with EEex "Uncap FPS"; BGEE 2.7.3 only.
InterpolateAnimations = false
; Smooth the fog-of-war edge. SoftFogRadius is the blur in world pixels;
; 0 keeps the engine's own edge. BGEE 2.7.3 only. With EnableDebugHotkeys,
; F8 toggles it.
SoftFogOfWar = false
SoftFogRadius = 24
; Glow around the engine's light-emitting effects (fires, torches, spells),
; never the UI or merely bright art. BloomStrength is the halo; LightSpill is
; how much those effects brighten and tint what is around them (0 = off).
; BGEE 2.7.3 only. With EnableDebugHotkeys, F9 toggles it.
Bloom = false
BloomStrength = 0.35
LightSpill = 1.5

[Detection]
; Collect the current area's authored ambient animations from engine memory
; and classify fire/smoke/fountain/light point sources.
AreaAnimationScan = true

[Shaders]
; Diagnostic only: archive original shaders to iee-shader-dumps/ next to the DLL.
DumpEngineShaders = false
; F10 toggles the visual effect of overrides (uIeeEnabled) for A/B comparison.
EnableDebugHotkeys = false
; Start the bundled water shader enabled when it is installed in the game's override directory.
EnableWaterEffect = true
; Fire glow/heat shimmer, chimney-smoke haze, and candle glows placed from the
; area's classified ambient animations (requires the fpSEAM override).
EnablePointEffects = true
